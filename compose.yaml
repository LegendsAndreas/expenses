x-common-security: &common-security
  user: "1001:1001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 100

services:
  expenses-app:
    <<: *common-security
    ports:
      - "8090:8090"
    build:
      dockerfile: expenses-app/Dockerfile
      context: .
  